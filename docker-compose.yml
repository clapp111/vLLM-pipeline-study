services:
  vllm:
    image: vllm/vllm-openai:v0.8.5.post1
    container_name: vllm-dongmin
    command: >
      --model /models/Qwen3-4B-AWQ
      --served-model-name qwen3-4b-awq
      --quantization awq
      --dtype half
      --gpu-memory-utilization 0.85
      --max-model-len 2048
      --enforce-eager
    environment:
      # HF 런타임 접속 차단 — 항상 ./models 의 로컬 가중치만 로드
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    depends_on:
      vllm:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./configs/litellm-config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-1234}
    ports:
      - "4000:4000"
