# litellm proxy 설정
# 클라이언트는 model="news-classifier" 로 호출 → litellm 이 vLLM(OpenAI 호환)으로 라우팅
model_list:
  - model_name: news-classifier
    litellm_params:
      # openai/<vLLM served-model-name> 형식으로 OpenAI 호환 백엔드에 연결
      model: openai/news-classifier
      api_base: http://vllm:8000/v1
      api_key: "dummy"   # vLLM 은 키 검증 안 함(placeholder)

litellm_settings:
  drop_params: true      # 백엔드가 모르는 파라미터는 무시

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
